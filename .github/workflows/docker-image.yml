name: Docker Image

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${IMAGE_NAME}:prod"
              echo "${IMAGE_NAME}:latest"
            else
              echo "${IMAGE_NAME}:dev"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          no-cache: true

      - name: Trigger Dokploy test deploy
        if: github.event_name == 'push' && github.ref_name == 'dev'
        run: |
          set -euo pipefail
          out=$(curl -fsS --max-time 60 -X POST "${{ secrets.DOKPLOY_TEST_DEPLOY_WEBHOOK }}")
          echo "Dokploy responded: $out"
          # A Cloudflare Access redirect is a 302, which curl treats as success.
          # Assert the real answer, otherwise a blocked webhook looks like a deploy.
          echo "$out" | grep -q "deployed successfully" \
            || { echo "::error::Dokploy did not accept the test deploy (webhook blocked or rejected)"; exit 1; }

      - name: Trigger Dokploy production deploy
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          out=$(curl -fsS --max-time 60 -X POST "${{ secrets.DOKPLOY_PROD_DEPLOY_WEBHOOK }}")
          echo "Dokploy responded: $out"
          # A Cloudflare Access redirect is a 302, which curl treats as success.
          # Assert the real answer, otherwise a blocked webhook looks like a deploy.
          echo "$out" | grep -q "deployed successfully" \
            || { echo "::error::Dokploy did not accept the production deploy (webhook blocked or rejected)"; exit 1; }
